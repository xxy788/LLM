[llm]
; 兼容 OpenAI 接口协议的服务地址（示例为百度千帆 v2，可换成其他服务商）
base_url = https://qianfan.baidubce.com/v2/chat/completions
; 你的 API key —— 只填在这里，不要写进任何代码文件
; 千帆的 key 形如 bce-v3/ALTAK-xxxx/yyyy
api_key = bce-v3/ALTAK-xxxxxxxxxxxxxxxxxxxx/yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
; 模型名称
model = ernie-4.5-turbo-32k

[search]
; 百度千帆「智能搜索生成」API Key（searchWeb 工具使用，也可与 [llm] 相同的 key）
baidu_qianfan = bce-v3/ALTAK-xxxxxxxxxxxxxxxxxxxx/yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
; 可选：搜索接口地址与模型，缺省为官方端点及 [llm] 的 model
; base_url = https://qianfan.baidubce.com/v2/ai_search/chat/completions
; model = ernie-4.5-turbo-32k
