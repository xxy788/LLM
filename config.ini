model = replace-with-your-model
context_window = 128k

[agent]
context_warning_ratio = 0.7
summary_target_tokens = 5000
summary_max_tokens = 6500
request_timeout = 120
summary_request_timeout = 120
session_dir = .agents/sessions
context_dir = .agents/context
agents_file = AGENTS.md
skill_dirs = office/mulu/.agent/skills/guizang-ppt-skill_#SULP#_0lea6z/guizang-ppt-skill
